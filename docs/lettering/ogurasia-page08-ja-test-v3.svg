  <text class="text" x="850" y="583"><tspan x="850" dy="0">さあ？</tspan></text>

  <text class="text compact" x="140" y="878"><tspan x="140" dy="0">クジラって</tspan><tspan x="140" dy="21">賢いとは</tspan><tspan x="140" dy="21">聞いたけど、</tspan></text>
  <text class="text answer" x="625" y="883"><tspan x="625" dy="0">賢いのでIQ</tspan><tspan x="625" dy="25">なんて言わないのさ</tspan></text>

  <text class="text" x="475" y="1218"><tspan x="475" dy="0">ここのこと、</tspan><tspan x="475" dy="30">知りたい？</tspan></text>
